[project]
name = "homeorbit-api"
version = "0.1.0"
description = "HomeOrbit（家环）GIS 分析与 AI Agent 后端"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "uvicorn[standard]>=0.30",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1,<2",
    "pytest-httpx>=0.35,<1",
]
data = [
    "osmium>=4.3,<5",
    "pyproj>=3.7,<4",
    "pyshp>=2.3,<3",
]

[tool.pytest.ini_options]
markers = ["integration: requires local PostGIS and/or Valhalla"]
pythonpath = ["."]
